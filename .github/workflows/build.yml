name: Build Shard Shop 0.3.5
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and build Shop
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew clean build --no-daemon; else gradle clean build --no-daemon; fi
      - name: Verify four-category compiled menu
        run: python3 scripts/verify_shop_jar.py build/libs/chill-zone-shop-0.3.5.jar
      - name: Upload Shop JAR
        uses: actions/upload-artifact@v4
        with:
          name: chill-zone-shop-0.3.5
          path: build/libs/chill-zone-shop-0.3.5.jar
          if-no-files-found: error
